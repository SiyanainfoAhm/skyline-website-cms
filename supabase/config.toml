[functions.portal-document-extract]
# The browser enqueue branch verifies the user's bearer token in code. The
# scheduled worker branch is authenticated with the separate worker secret.
verify_jwt = false

[functions.public-assistant]
# Public endpoint; database access is service-role-only and it contains no
# caller-controlled table, source or document identifier.
verify_jwt = false

[functions.public-assistant-index]
# Worker is authenticated with x-worker-secret, not a browser JWT.
verify_jwt = false

[functions.notification-delivery]
# Server-to-server only. The worker route requires x-worker-secret (EF_NOTIFICATION_WORKER_SECRET); the /webhook route requires
# HTTP Basic credentials (EF_POSTMARK_WEBHOOK_USER/PASSWORD). Both fail closed (401, or 503 when unconfigured). Postmark cannot send a JWT.
verify_jwt = false
